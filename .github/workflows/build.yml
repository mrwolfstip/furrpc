name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
      - run: ditto -c -k --keepParent build/furrpc.app furrpc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: furrpc
          path: furrpc.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: furrpc.zip
